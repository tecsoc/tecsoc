name: Update profile cards

on:
  schedule:
    - cron: '17 21 * * *' # 毎日 06:17 JST
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@abb8761d64babb580b336af88cccb2db39063440
        with:
          card: stats
          options: username=tecsoc&theme=shadow_blue&show_icons=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          core_version: '2.2.0'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@abb8761d64babb580b336af88cccb2db39063440
        with:
          card: top-langs
          options: username=tecsoc&langs_count=10&theme=github_dark_dimmed
          path: profile/top-langs.svg
          core_version: '2.2.0'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        with:
          username: tecsoc
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ('stats', 'top-langs', 'trophy'):
              path = Path('profile') / f'{name}.svg'
              root = ET.parse(path).getroot()
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  raise ValueError(f'{path} is not an SVG')
              if 'Something went wrong' in path.read_text():
                  raise ValueError(f'{path} contains an error card')
          PY

      - name: Commit updated cards
        run: |
          git add profile/stats.svg profile/top-langs.svg profile/trophy.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update profile cards"
          git push
